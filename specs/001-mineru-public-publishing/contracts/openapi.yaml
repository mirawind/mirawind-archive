openapi: 3.1.0
info:
  title: Mirawind MinerU Publishing API
  version: 4.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: Single MinerU content-list v2 ZIP ingestion into editable IR v1, timestamped saves and build-bound publication. Management responses require the sole administrator and prohibit caching and indexing. Better Auth owns its authentication protocol endpoints.
servers:
  - url: https://library.example.test
tags:
  - name: Public
    description: Anonymous current-public reading, search, asset and original-file routes.
  - name: Imports
    description: Single-book MinerU v2 ZIP upload and analysis.
  - name: Drafts
    description: Transactional block drafts, asynchronous preview builds and publication.
  - name: Jobs
    description: Sole-administrator durable task inspection and control.
paths:
  /read/{bookKey}/{pageKey}:
    get:
      tags:
        - Public
      operationId: readPublishedPage
      summary: Read one pre-generated page from the current visible version
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BookKey"
        - $ref: "#/components/parameters/PageKey"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Current public semantic HTML
          headers:
            Cache-Control:
              description: Public books revalidate; administrator-only private books never store.
              schema:
                type: string
                enum:
                  - public, max-age=0, must-revalidate
                  - private, no-store
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            text/html:
              schema:
                type: string
        "304":
          description: Authorized current representation is unchanged
          headers:
            Cache-Control:
              schema:
                type: string
                const: public, max-age=0, must-revalidate
            ETag:
              $ref: "#/components/headers/ETag"
        "404":
          $ref: "#/components/responses/HiddenOrMissingHtml"
        "503":
          description: This book has no verified recoverable current version
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            text/html:
              schema:
                type: string
  /books/{bookKey}/assets/{versionId}/{resourceId}:
    get:
      tags:
        - Public
      operationId: readPublishedAsset
      summary: Read a version-pinned generated reading asset
      security:
        - {}
        - cookieAuth: []
      description: |
        The version must be current or previously published; ready, failed and corrupt
        versions are never exposed. The book must still be public at request time.
      parameters:
        - $ref: "#/components/parameters/BookKey"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Authorized immutable resource
          headers:
            Cache-Control:
              description: Public books use private browser-only immutable cache; private books never store.
              schema:
                type: string
                enum:
                  - private, max-age=31536000, immutable
                  - private, no-store
            ETag:
              $ref: "#/components/headers/ETag"
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            image/*:
              schema:
                type: string
                contentEncoding: binary
        "304":
          description: Authorized immutable representation is unchanged
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - private, max-age=31536000, immutable
                  - private, no-store
            ETag:
              $ref: "#/components/headers/ETag"
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
        "404":
          $ref: "#/components/responses/HiddenOrMissingBinary"
  /books/{bookKey}/originals/{fileId}:
    get:
      tags:
        - Public
      operationId: downloadOriginal
      summary: Download or resume one registered original file
      security:
        - {}
        - cookieAuth: []
      description: Authorization is evaluated before ETag, If-Range or Range processing.
      parameters:
        - $ref: "#/components/parameters/BookKey"
        - $ref: "#/components/parameters/FileId"
        - name: Range
          in: header
          required: false
          schema:
            type: string
            pattern: ^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          $ref: "#/components/responses/OriginalFile"
        "206":
          description: Authorized single byte range
          headers:
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Range:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
                minimum: 0
            Content-Disposition:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            ETag:
              $ref: "#/components/headers/ETag"
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            X-Robots-Tag:
              schema:
                type: string
                const: noindex, nofollow, noarchive, nosnippet
          content:
            application/octet-stream:
              schema:
                type: string
                contentEncoding: binary
        "304":
          description: Authorized full representation is unchanged
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            ETag:
              $ref: "#/components/headers/ETag"
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
        "404":
          $ref: "#/components/responses/HiddenOrMissingBinary"
        "416":
          description: Unsatisfiable or unsupported range
          headers:
            Content-Range:
              schema:
                type: string
                pattern: ^bytes \*/[0-9]+$
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
  /api/books/{bookKey}/search:
    get:
      tags:
        - Public
      operationId: searchPublishedBook
      summary: Search the current visible version of one book
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BookKey"
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 500
      responses:
        "200":
          description: Current-version results only
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - public, max-age=0, must-revalidate
                  - private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/HiddenOrMissingJson"
  /api/manage/imports:
    post:
      tags:
        - Imports
      operationId: createImport
      summary: Stream one MinerU ZIP and enqueue analysis
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 200
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
              properties:
                file:
                  type: string
                  contentMediaType: application/zip
                  contentEncoding: binary
      responses:
        "202":
          description: Upload is durable and analysis is queued
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Actual streamed upload exceeded 2 GiB
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/manage/imports/{importId}:
    get:
      tags:
        - Imports
      operationId: getImport
      summary: Inspect import state, selected v2 document and diagnostics
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: Import state
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        "404":
          $ref: "#/components/responses/HiddenOrMissingJson"
  /api/manage/books/{bookId}:
    delete:
      tags:
        - Drafts
      operationId: permanentlyDeleteBook
      summary: Irreversibly hide one book and enqueue contained permanent cleanup
      description: |
        Uses the existing valid sole-administrator session without a recent-auth
        requirement. The current displayed title is compared exactly after NFC
        normalization. Acceptance has no recycle bin, restore, or undo behavior.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/Origin"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 200
        - name: If-Match
          in: header
          required: true
          description: Strong mutation token returned by the private library API.
          schema:
            type: string
            minLength: 20
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - confirmationTitle
              properties:
                confirmationTitle:
                  type: string
                  maxLength: 500
      responses:
        "202":
          description: Deletion barrier committed and durable cleanup accepted
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDeletionAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundJson"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          description: Title, mutation token, or current book state is stale
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/manage/books/{bookId}/draft:
    get:
      tags:
        - Drafts
      operationId: getBookDraft
      summary: Read the editable structure, timestamp, current build and diagnostics
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Current draft representation
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "404":
          $ref: "#/components/responses/HiddenOrMissingJson"
    patch:
      tags:
        - Drafts
      operationId: saveDraft
      summary: Commit a timestamp-checked structured draft edit
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/Origin"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,100}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expected_updated_at
              properties:
                alias:
                  oneOf:
                    - type: string
                      pattern: ^(?![0-9]+$)[a-z0-9]+(?:-[a-z0-9]+)*$
                      maxLength: 120
                    - type: "null"
                boundaries:
                  type: object
                  additionalProperties: false
                  properties:
                    body_start_block_id:
                      type: string
                      pattern: ^blk_[A-Za-z0-9_-]{16,80}$
                    appendix_start_block_id:
                      oneOf:
                        - type: string
                          pattern: ^blk_[A-Za-z0-9_-]{16,80}$
                        - type: "null"
                    backmatter_start_block_id:
                      oneOf:
                        - type: string
                          pattern: ^blk_[A-Za-z0-9_-]{16,80}$
                        - type: "null"
                numbering:
                  type: string
                  enum:
                    - source
                    - generated
                    - none
                metadata:
                  type: object
                  additionalProperties: false
                  properties:
                    title:
                      type: string
                      minLength: 1
                      maxLength: 500
                    subtitle:
                      oneOf:
                        - type: string
                          maxLength: 500
                        - type: "null"
                    authors:
                      oneOf:
                        - type: array
                          items:
                            type: string
                            minLength: 1
                            maxLength: 200
                          uniqueItems: true
                          maxItems: 100
                        - type: "null"
                    contributors:
                      oneOf:
                        - type: array
                          items:
                            type: string
                            minLength: 1
                            maxLength: 200
                          uniqueItems: true
                          maxItems: 100
                        - type: "null"
                    description:
                      oneOf:
                        - type: string
                          maxLength: 10000
                        - type: "null"
                    language:
                      oneOf:
                        - type: string
                          pattern: ^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
                        - type: "null"
                    publisher:
                      oneOf:
                        - type: string
                          maxLength: 300
                        - type: "null"
                    year:
                      oneOf:
                        - type: integer
                          minimum: 1
                          maximum: 9999
                        - type: "null"
                    edition:
                      oneOf:
                        - type: string
                          maxLength: 100
                        - type: "null"
                    isbn_10:
                      oneOf:
                        - type: string
                          pattern: ^[0-9]{9}[0-9X]$
                        - type: "null"
                    isbn_13:
                      oneOf:
                        - type: string
                          pattern: ^[0-9]{13}$
                        - type: "null"
                    cover_resource_id:
                      oneOf:
                        - type: string
                          pattern: ^res_[A-Za-z0-9_-]{16,80}$
                        - type: "null"
                expected_updated_at:
                  type: integer
                  minimum: 0
                  maximum: 8640000000000000
                blocks:
                  type: array
                  maxItems: 20000
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - block_id
                    properties:
                      alias:
                        oneOf:
                          - type: string
                            pattern: ^(?![0-9]+$)[a-z0-9]+(?:-[a-z0-9]+)*$
                            maxLength: 120
                          - type: "null"
                      block_id:
                        type: string
                        pattern: ^blk_[A-Za-z0-9_-]{16,80}$
                      include_in_toc:
                        type: boolean
                      source_number:
                        oneOf:
                          - type: string
                            minLength: 1
                            maxLength: 100
                          - type: "null"
                      starts_page:
                        type: boolean
                      exclude_from_numbering:
                        type: boolean
                      level:
                        type: integer
                        minimum: 1
                        maximum: 4
                      markdown:
                        type: string
                        maxLength: 4194304
                        description: Local editing syntax for the target block. Heading text is limited to 2000 characters; heading-only properties require a heading block.
      responses:
        "200":
          description: The structured draft has been committed. Preview construction is independent.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftUpdateAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundJson"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          description: The expected_updated_at value is stale; local changes must be retained.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: Commits a batch of block edits and optional metadata/settings atomically. All block types use blocks[]; duplicate IDs and overlapping parent/child edits are rejected. Responses require administrator authorization and are neither cached nor indexed.
  /api/manage/books/{bookId}/draft/images:
    get:
      tags: [Drafts]
      operationId: listDraftImages
      summary: List available book-owned images
      description: Administrator-only resource catalogue, independent of build readiness or freshness. Includes unused imported images; pending deletions are omitted. Anonymous or missing books return indistinguishable 404 responses. Never cached or indexed.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Available images and current draft cover selection
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [images]
                properties:
                  images:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        [
                          resource_id,
                          path,
                          url,
                          media_type,
                          size_bytes,
                          width,
                          height,
                          selected,
                        ]
                      properties:
                        resource_id: { type: string }
                        path: { type: string }
                        url: { type: string }
                        media_type: { type: string }
                        size_bytes: { type: integer, minimum: 0 }
                        width: { type: integer, minimum: 1 }
                        height: { type: integer, minimum: 1 }
                        selected: { type: boolean }
        "404":
          $ref: "#/components/responses/HiddenOrMissingJson"
  /api/manage/books/{bookId}/draft/images/{resourceId}:
    get:
      tags: [Drafts]
      operationId: getDraftImage
      summary: Read an available image from the book resource catalogue
      description: Administrator-only; resource must belong to this active book and not be pending deletion. Does not require a ready build. Anonymous, missing and unavailable images return 404. Never cached or indexed.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - name: resourceId
          in: path
          required: true
          schema: { type: string, pattern: "^res_[A-Za-z0-9_-]{16,80}$" }
      responses:
        "200":
          description: Original registered image bytes with their image media type
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
        "404":
          $ref: "#/components/responses/HiddenOrMissingJson"
  /api/manage/books/{bookId}/build:
    post:
      tags:
        - Drafts
      operationId: buildBookPreview
      summary: Request a preview build of the saved document
      description: Administrator-only and same-origin. Coalesces queued work and flushes its debounce. Responses are never cached or indexed.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expected_updated_at
              properties:
                expected_updated_at:
                  type: integer
                  minimum: 0
                  maximum: 8640000000000000
      responses:
        "202":
          description: Preview build requested
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - build_id
                  - job_id
                properties:
                  build_id:
                    type: string
                  job_id:
                    type: string
        "404":
          $ref: "#/components/responses/HiddenOrMissingJson"
        "412":
          description: The document changed since it was read
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/manage/books/{bookId}/publish:
    post:
      tags:
        - Drafts
      operationId: publishBook
      summary: Publish the current ready build
      description: Promotes only the submitted current ready build. Mismatched source timestamps, failed builds and blocking diagnostics prevent publication. Published content and book access remain unchanged on failure.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expected_updated_at
                - build_id
              properties:
                expected_updated_at:
                  type: integer
                  minimum: 0
                  maximum: 8640000000000000
                build_id:
                  type: string
                  pattern: ^ver_[A-Za-z0-9_-]{16,80}$
      responses:
        "200":
          description: Candidate published atomically
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - published_at
                  - state
                  - version_id
                properties:
                  published_at:
                    type: integer
                    minimum: 0
                  state:
                    type: string
                    const: published
                  version_id:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundJson"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/Conflict"
  /api/manage/books/{bookId}/access:
    patch:
      tags:
        - Drafts
      operationId: setBookAccess
      summary: Change private or public access independently from publication
      description: Public access requires an existing published version.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - access
              properties:
                access:
                  type: string
                  enum:
                    - private
                    - public
      responses:
        "200":
          description: Access changed atomically
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - book_id
                  - access
                properties:
                  book_id:
                    type: integer
                  access:
                    type: string
                    enum:
                      - private
                      - public
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundJson"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/manage/jobs/{jobId}:
    get:
      tags:
        - Jobs
      operationId: getJob
      summary: Inspect durable task status and safe diagnostics
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Task state
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/HiddenOrMissingJson"
  /api/manage/jobs/{jobId}/cancel:
    post:
      tags:
        - Jobs
      operationId: cancelJob
      summary: Request cancellation of queued or running work
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/Origin"
      responses:
        "202":
          description: Cancellation recorded
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundJson"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/manage/jobs/{jobId}/retry:
    post:
      tags:
        - Jobs
      operationId: retryJob
      summary: Explicitly enqueue an eligible terminal job as a new attempt
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/Origin"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 200
      responses:
        "202":
          description: New attempt queued; prior history is retained
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundJson"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/manage/books/{bookId}/preview/{buildId}/pages/{pageId}:
    get:
      tags:
        - Drafts
      operationId: readDraftPreviewPage
      summary: Read one authenticated non-cacheable draft preview page
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/BuildId"
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: Sanitized preview HTML
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            X-Robots-Tag:
              schema:
                type: string
                const: noindex, nofollow, noarchive, nosnippet
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/HiddenOrMissingHtml"
  /api/manage/books/{bookId}/preview/{buildId}/assets/{resourceId}:
    get:
      tags:
        - Drafts
      operationId: readDraftPreviewAsset
      summary: Read a build-bound resource using a session-bound signed authorization
      security:
        - previewAuthorization: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/BuildId"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Preview resource
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            X-Robots-Tag:
              schema:
                type: string
                const: noindex, nofollow, noarchive, nosnippet
          content:
            image/*:
              schema:
                type: string
                contentEncoding: binary
        "404":
          $ref: "#/components/responses/HiddenOrMissingBinary"
  /api/manage/books/{bookId}/draft/blocks/{blockId}:
    get:
      tags:
        - Drafts
      operationId: getDraftBlock
      summary: Read one block in the local Markdown editing syntax
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/BlockId"
      responses:
        "200":
          description: Current draft representation
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - block_id
                  - updated_at
                  - kind
                  - markdown
                properties:
                  block_id:
                    type: string
                    pattern: ^blk_[A-Za-z0-9_-]{16,80}$
                  updated_at:
                    type: integer
                    minimum: 0
                    maximum: 8640000000000000
                  kind:
                    type: string
                  markdown:
                    type: string
                    maxLength: 4194304
        "404":
          $ref: "#/components/responses/HiddenOrMissingJson"
  /api/manage/books/{bookId}/draft/cover:
    post:
      tags:
        - Drafts
      operationId: uploadDraftCover
      summary: Commit an uploaded cover and schedule a preview build
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
                - expected_updated_at
              properties:
                file:
                  type: string
                  contentEncoding: binary
                expected_updated_at:
                  type: string
                  pattern: ^[0-9]+$
      responses:
        "200":
          description: The structured draft has been committed. Preview construction is independent.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - updated_at
                  - resource_id
                properties:
                  updated_at:
                    type: integer
                    minimum: 0
                    maximum: 8640000000000000
                  resource_id:
                    type: string
                    pattern: ^res_[A-Za-z0-9_-]{16,80}$
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundJson"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          description: The expected_updated_at value is stale; local changes must be retained.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: |
        Better Auth database session cookie. Production may add the standard Secure
        cookie prefix; clients should use the Set-Cookie value rather than hard-code it.
    previewAuthorization:
      type: apiKey
      in: query
      name: authorization
      description: Time-limited HMAC authorization bound to the active administrator session, book, build and resource.
  parameters:
    BookKey:
      name: bookKey
      in: path
      required: true
      schema:
        type: string
        pattern: ^(?:[1-9][0-9]*|[a-z0-9]+(?:-[a-z0-9]+)*)$
    PageKey:
      name: pageKey
      in: path
      required: true
      schema:
        type: string
        pattern: ^(?:[1-9][0-9]*|[a-z0-9]+(?:-[a-z0-9]+)*)$
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PageId:
      name: pageId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        pattern: ^ver_[A-Za-z0-9_-]{16,80}$
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        pattern: ^res_[A-Za-z0-9_-]{16,80}$
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        pattern: ^file_[A-Za-z0-9_-]{16,80}$
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        pattern: ^imp_[A-Za-z0-9_-]{16,80}$
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        pattern: ^job_[A-Za-z0-9_-]{16,80}$
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    Origin:
      name: Origin
      in: header
      required: true
      description: Exact configured Web origin; state-changing browser requests are origin checked.
      schema:
        type: string
        format: uri
    BuildId:
      name: buildId
      in: path
      required: true
      schema:
        type: string
        pattern: ^ver_[A-Za-z0-9_-]{16,80}$
    BlockId:
      name: blockId
      in: path
      required: true
      schema:
        type: string
        pattern: ^blk_[A-Za-z0-9_-]{16,80}$
  headers:
    ETag:
      schema:
        type: string
  responses:
    OriginalFile:
      description: Authorized complete registered original
      headers:
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Content-Length:
          schema:
            type: integer
            minimum: 0
        Content-Disposition:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        ETag:
          $ref: "#/components/headers/ETag"
        X-Content-Type-Options:
          schema:
            type: string
            const: nosniff
        X-Robots-Tag:
          schema:
            type: string
            const: noindex, nofollow, noarchive, nosnippet
      content:
        application/zip:
          schema:
            type: string
            contentEncoding: binary
    BadRequest:
      description: Invalid input or semantic validation failure
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid administrator session
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Valid session is not the sole administrator or the required 300-second freshness/password reauthentication policy is not satisfied
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: State, revision, active-job or idempotency conflict
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFoundJson:
      description: Management resource does not exist
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFoundHtml:
      description: Management representation does not exist
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        text/html:
          schema:
            type: string
    HiddenOrMissingJson:
      description: Public resource is missing or not anonymously visible
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
        X-Robots-Tag:
          schema:
            type: string
            const: noindex, nofollow, noarchive, nosnippet
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HiddenOrMissingHtml:
      description: Public resource is missing or not anonymously visible
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
        X-Robots-Tag:
          schema:
            type: string
            const: noindex, nofollow, noarchive, nosnippet
      content:
        text/html:
          schema:
            type: string
    HiddenOrMissingBinary:
      description: Binary resource is missing or not anonymously visible
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
        X-Content-Type-Options:
          schema:
            type: string
            const: nosniff
        X-Robots-Tag:
          schema:
            type: string
            const: noindex, nofollow, noarchive, nosnippet
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,80}$
        message:
          type: string
          maxLength: 500
        request_id:
          type: string
          maxLength: 100
        details:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
              - code
            properties:
              code:
                type: string
                maxLength: 80
              block_id:
                type: string
                maxLength: 100
              build_id:
                type: string
                maxLength: 100
              field:
                type: string
                maxLength: 200
              message:
                type: string
                maxLength: 500
    ImportAccepted:
      type: object
      additionalProperties: false
      required:
        - import_id
        - job_id
        - state
      properties:
        import_id:
          type: string
          pattern: ^imp_[A-Za-z0-9_-]{16,80}$
        job_id:
          type: string
          pattern: ^job_[A-Za-z0-9_-]{16,80}$
        state:
          type: string
          const: uploaded
    JobAccepted:
      type: object
      additionalProperties: false
      required:
        - job_id
        - state
      properties:
        job_id:
          type: string
          pattern: ^job_[A-Za-z0-9_-]{16,80}$
        state:
          type: string
          const: queued
    BookDeletionAccepted:
      type: object
      additionalProperties: false
      required:
        - deletionId
        - jobId
        - state
        - taskUrl
      properties:
        deletionId:
          type: string
          pattern: ^del_[A-Za-z0-9_-]{16,80}$
        jobId:
          type: string
          pattern: ^job_[A-Za-z0-9_-]{16,80}$
        state:
          type: string
          enum:
            - pending
            - purging
            - failed
            - completed
        taskUrl:
          type: string
          const: /manage/tasks
    Import:
      type: object
      additionalProperties: false
      required:
        - import_id
        - state
        - current_job
        - source_name
        - preview
        - created_at
        - updated_at
      properties:
        import_id:
          type: string
          pattern: ^imp_[A-Za-z0-9_-]{16,80}$
        source_name:
          type: string
          minLength: 1
          maxLength: 255
        state:
          type: string
          enum:
            - uploaded
            - analyzing
            - preparing
            - draft_ready
            - rejected
            - canceled
            - expired
        current_job:
          anyOf:
            - $ref: "#/components/schemas/Job"
            - type: "null"
        preview:
          type: object
          additionalProperties: false
          required:
            - state
            - source_updated_at
            - url
          properties:
            state:
              type: string
              enum:
                - building
                - failed
                - ready
                - unavailable
            url:
              type:
                - string
                - "null"
              maxLength: 500
            source_updated_at:
              type:
                - integer
                - "null"
              minimum: 0
              maximum: 8640000000000000
        book_id:
          type:
            - integer
            - "null"
          minimum: 1
        error_code:
          type:
            - string
            - "null"
          maxLength: 80
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        source_path:
          type:
            - string
            - "null"
          maxLength: 2048
    Draft:
      type: object
      additionalProperties: false
      required:
        - access
        - alias
        - boundaries
        - book_id
        - build_published
        - updated_at
        - diagnostics
        - metadata
        - numbering
        - published
        - preview
        - structure
        - title
        - build
      properties:
        access:
          type: string
          enum:
            - private
            - public
        alias:
          oneOf:
            - type: string
              pattern: ^(?![0-9]+$)[a-z0-9]+(?:-[a-z0-9]+)*$
              maxLength: 120
            - type: "null"
        boundaries:
          type: object
          additionalProperties: false
          required:
            - body_start_block_id
          properties:
            body_start_block_id:
              type: string
              pattern: ^blk_[A-Za-z0-9_-]{16,80}$
            appendix_start_block_id:
              type: string
              pattern: ^blk_[A-Za-z0-9_-]{16,80}$
            backmatter_start_block_id:
              type: string
              pattern: ^blk_[A-Za-z0-9_-]{16,80}$
        book_id:
          type: integer
          minimum: 1
        build_published:
          type: boolean
        numbering:
          type: string
          enum:
            - source
            - generated
            - none
        title:
          type: string
          minLength: 1
          maxLength: 500
        diagnostics:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required:
              - code
              - message
            properties:
              blockId:
                type: string
                maxLength: 100
              code:
                type: string
                pattern: ^[A-Z][A-Z0-9_]{2,79}$
              confidence:
                type: string
                enum:
                  - high
                  - low
                  - medium
              evidence:
                type: array
                maxItems: 10
                items:
                  type: string
                  maxLength: 200
              location:
                type: object
                additionalProperties: false
                properties:
                  blockId:
                    type: string
                    maxLength: 100
                  pageIndex:
                    type: integer
                    minimum: 0
                  regionId:
                    type: string
                    maxLength: 100
              message:
                type: string
                maxLength: 500
              path:
                type: string
                maxLength: 500
              phase:
                type: string
                enum:
                  - contents
                  - matching
                  - ocr
                  - selection
                  - splitting
                  - structure
                  - typography
              severity:
                type: string
                enum:
                  - error
                  - info
                  - warning
              targets:
                type: array
                maxItems: 10
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - blockId
                    - kind
                    - pageId
                  properties:
                    blockId:
                      type: string
                      maxLength: 100
                    kind:
                      type: string
                      enum:
                        - edit_block
                        - select_structure
                    pageId:
                      type: integer
                      minimum: 1
        metadata:
          type: object
          additionalProperties: false
          required:
            - title
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 500
            subtitle:
              type: string
              maxLength: 500
            authors:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 200
              uniqueItems: true
              maxItems: 100
            contributors:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 200
              uniqueItems: true
              maxItems: 100
            description:
              type: string
              maxLength: 10000
            language:
              type: string
              pattern: ^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
            publisher:
              type: string
              maxLength: 300
            year:
              type: integer
              minimum: 1
              maximum: 9999
            edition:
              type: string
              maxLength: 100
            isbn_10:
              type: string
              pattern: ^[0-9]{9}[0-9X]$
            isbn_13:
              type: string
              pattern: ^[0-9]{13}$
            cover_resource_id:
              type: string
              pattern: ^res_[A-Za-z0-9_-]{16,80}$
        published:
          type: boolean
        structure:
          type: array
          maxItems: 20000
          items:
            type: object
            additionalProperties: false
            required:
              - block_id
              - display_level
              - include_in_toc
              - starts_page
              - title_markdown
              - exclude_from_numbering
            properties:
              alias:
                type: string
                pattern: ^(?![0-9]+$)[a-z0-9]+(?:-[a-z0-9]+)*$
                maxLength: 120
              block_id:
                type: string
                pattern: ^blk_[A-Za-z0-9_-]{16,80}$
              display_level:
                type: integer
                minimum: 1
                maximum: 4
              include_in_toc:
                type: boolean
              source_number:
                type: string
                minLength: 1
                maxLength: 100
              starts_page:
                type: boolean
              title_markdown:
                type: string
                minLength: 1
                maxLength: 2000
              exclude_from_numbering:
                type: boolean
        preview:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - boundaries
                - compiler_version
                - source_updated_at
                - headings
                - is_stale
                - pages
                - renderer_version
                - semantic_digest
                - build_id
                - version
              properties:
                boundaries:
                  type: object
                  additionalProperties: false
                  required:
                    - body_start_block_id
                  properties:
                    body_start_block_id:
                      type: string
                      pattern: ^blk_[A-Za-z0-9_-]{16,80}$
                    appendix_start_block_id:
                      type: string
                      pattern: ^blk_[A-Za-z0-9_-]{16,80}$
                    backmatter_start_block_id:
                      type: string
                      pattern: ^blk_[A-Za-z0-9_-]{16,80}$
                compiler_version:
                  type: string
                  const: compiler-v8
                is_stale:
                  type: boolean
                renderer_version:
                  type: string
                  const: semantic-html-v8-katex-0.18.1
                semantic_digest:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                pages:
                  type: array
                  maxItems: 20000
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - page_id
                      - title
                    properties:
                      page_id:
                        type: integer
                        minimum: 1
                      title:
                        type: string
                        maxLength: 500
                headings:
                  type: array
                  maxItems: 20000
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - block_id
                      - title
                      - title_markdown
                      - display_level
                      - include_in_toc
                      - starts_page
                      - page_id
                      - number
                      - exclude_from_numbering
                    properties:
                      block_id:
                        type: string
                        pattern: ^blk_[A-Za-z0-9_-]{16,80}$
                      title:
                        type: string
                        maxLength: 500
                      title_markdown:
                        type: string
                        maxLength: 2000
                      source_number:
                        oneOf:
                          - type: string
                            minLength: 1
                            maxLength: 100
                          - type: "null"
                      display_level:
                        type: integer
                        minimum: 1
                        maximum: 4
                      include_in_toc:
                        type: boolean
                      starts_page:
                        type: boolean
                      page_id:
                        oneOf:
                          - type: integer
                            minimum: 1
                          - type: "null"
                      number:
                        type:
                          - string
                          - "null"
                        maxLength: 120
                      exclude_from_numbering:
                        type: boolean
                source_updated_at:
                  type: integer
                  minimum: 0
                  maximum: 8640000000000000
                build_id:
                  type: string
                  pattern: ^ver_[A-Za-z0-9_-]{16,80}$
                version:
                  type: string
                  const: draft-preview-v8
            - type: "null"
        updated_at:
          type: integer
          minimum: 0
          maximum: 8640000000000000
        build:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                - id
                - job_id
                - state
                - source_updated_at
                - safe_error_code
              properties:
                id:
                  type: string
                  pattern: ^ver_[A-Za-z0-9_-]{16,80}$
                job_id:
                  type: string
                  pattern: ^job_[A-Za-z0-9_-]{16,80}$
                state:
                  type: string
                  enum:
                    - building
                    - ready
                    - failed
                    - canceled
                    - interrupted
                source_updated_at:
                  type: integer
                  minimum: 0
                  maximum: 8640000000000000
                safe_error_code:
                  type:
                    - string
                    - "null"
                  maxLength: 80
    DraftUpdateAccepted:
      type: object
      additionalProperties: false
      required:
        - updated_at
      properties:
        updated_at:
          type: integer
          minimum: 0
          maximum: 8640000000000000
    Job:
      type: object
      additionalProperties: false
      required:
        - job_id
        - kind
        - state
        - attempt
        - automatic_retry_count
        - retry_of_job_id
        - phase
        - progress
        - error_code
        - error_class
        - cancellation_requested_at
        - created_at
        - started_at
        - finished_at
        - subject
      properties:
        job_id:
          type: string
          pattern: ^job_[A-Za-z0-9_-]{16,80}$
        kind:
          type: string
          enum:
            - analyze_import
            - prepare_draft
            - build_book
            - permanent_book_deletion
        state:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - canceled
            - interrupted
        attempt:
          type: integer
          minimum: 1
        automatic_retry_count:
          type: integer
          minimum: 0
          maximum: 1
        retry_of_job_id:
          type:
            - string
            - "null"
          pattern: ^job_[A-Za-z0-9_-]{16,80}$
        phase:
          type: string
          maxLength: 80
        progress:
          type: object
          additionalProperties: false
          required:
            - completed
            - processed_bytes
            - total
            - unit
          properties:
            completed:
              type: integer
              minimum: 0
            processed_bytes:
              type:
                - integer
                - "null"
              minimum: 0
            total:
              type:
                - integer
                - "null"
              minimum: 0
            unit:
              type: string
              enum:
                - bytes
                - items
                - pages
                - steps
        cancellation_requested_at:
          type:
            - string
            - "null"
          format: date-time
        error_code:
          type:
            - string
            - "null"
          maxLength: 80
        error_class:
          type:
            - string
            - "null"
          enum:
            - null
            - infrastructure
            - content
            - validation
            - timeout
            - canceled
        created_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
        subject:
          type: object
          additionalProperties: false
          required:
            - kind
            - label
          properties:
            kind:
              type: string
              enum:
                - book
                - import
                - system
            label:
              type: string
              minLength: 1
              maxLength: 500
    SearchResponse:
      type: object
      additionalProperties: false
      required:
        - query
        - scope
        - results
      properties:
        query:
          type: string
        scope:
          type: string
          enum:
            - metadata_heading_body
            - metadata_heading_only
        notice:
          type:
            - string
            - "null"
          description: Explains the short-query limitation when scope is metadata_heading_only.
        results:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - book_id
              - page_id
              - block_id
              - kind
              - title
              - snippet
              - href
            properties:
              book_id:
                type: integer
                minimum: 1
              page_id:
                type: integer
                minimum: 1
              block_id:
                type: string
                pattern: ^blk_[A-Za-z0-9_-]{16,80}$
              kind:
                type: string
                enum:
                  - title
                  - author
                  - heading
                  - body
              title:
                type: string
                maxLength: 500
              snippet:
                type: string
                maxLength: 1000
              href:
                type: string
                format: uri-reference
        next_cursor:
          type:
            - string
            - "null"
